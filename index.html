
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guinée Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f4;color:#222}
header{background:#087b43;color:white;padding:22px;text-align:center}
header h1{margin:0}
.search{padding:15px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px}
h2{padding:0 15px}
.categories{display:flex;gap:10px;overflow:auto;padding:10px 15px}
.categories button{padding:12px;border:0;border-radius:20px;background:white;white-space:nowrap}
.categories button:first-child{background:#087b43;color:white}
.products{padding:15px}
.product{background:white;padding:18px;margin-bottom:12px;border-radius:12px}
.product button{background:#087b43;color:white;border:0;padding:10px 15px;border-radius:8px}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>🇬🇳 Guinée Market</h1>
<p>Achetez et vendez facilement en Guinée</p>
</header>
<div class="search">
<input type="search" placeholder="Rechercher un produit...">
</div>
<h2>Catégories</h2>
<div class="categories">
<button>Tout</button>
<button>Téléphones</button>
<button>Vêtements</button>
<button>Maison</button>
<button>Véhicules</button>
</div>
<h2>Produits populaires</h2>
<div class="products">
<div class="product">
<h3>📱 Téléphones</h3>
<p>Découvrez les téléphones disponibles.</p>
<button>Voir les produits</button>
</div>
<div class="product">
<h3>👕 Vêtements</h3>
<p>Découvrez les vêtements disponibles.</p>
<button>Voir les produits</button>
</div>
<div class="product">
<h3>🏠 Maison</h3>
<p>Découvrez les articles pour la maison.</p>
<button>Voir les produits</button>
</div>
</div>
<footer>© 2026 Guinée Market</footer>
</body>
</html>
