

<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guinée Market</title>

<style>

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:Arial,sans-serif;background:#f4f5f7;color:#222}

header{background:#087b43;color:white;padding:22px 15px;text-align:center}

header h1{font-size:27px}

header p{margin-top:7px}

.search{padding:15px}

.search input{width:100%;padding:14px;border:1px solid #ddd;border-radius:9px;font-size:16px}

.categories{display:flex;gap:9px;overflow-x:auto;padding:5px 15px 15px}

.categories button{border:0;background:white;padding:12px;border-radius:20px;white-space:nowrap}

.categories button.active{background:#087b43;color:white}

h2{padding:15px;font-size:20px}

.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}

.product{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 7px #ddd}

.product img{width:100%;height:135px;object-fit:cover}

.product .info{padding:10px}

.product h3{font-size:15px;margin-bottom:8px}

.price{color:#087b43;font-weight:bold;margin-bottom:8px}

.product button,.publish{background:#087b43;color:white;border:0;padding:10px;border-radius:7px;width:100%}

form{background:white;margin:15px;padding:15px;border-radius:12px}

form input,form textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:7px;font-size:15px}

.publish{padding:13px;font-size:16px}

footer{text-align:center;padding:25px;color:#666}

</style>

</head>

<body>

<header>

<h1>🇬🇳 GUINÉE MARKET</h1>

<p>Achetez et vendez partout en Guinée</p>

</header>

<div class="search">

<input id="search" placeholder="🔎 Rechercher un produit..." oninput="render()">

</div>

<div class="categories" id="categories">

<button class="active" onclick="category('Tous',this)">Tous</button>

<button onclick="category('Téléphones',this)">📱 Téléphones</button>

<button onclick="category('Vêtements',this)">👕 Vêtements</button>

<button onclick="category('Chaussures',this)">👟 Chaussures</button>

<button onclick="category('Accessoires',this)">🎧 Accessoires</button>

<button onclick="category('Autres',this)">Autres</button>

</div>

<h2>🛍️ Produits disponibles</h2>

<div class="products" id="products"></div>

<h2>➕ Publier une annonce</h2>

<form onsubmit="addProduct(event)">

<input id="name" placeholder="Nom du produit" required>

<input id="price" type="number" placeholder="Prix en GNF" required>

<input id="phone" type="tel" placeholder="Numéro WhatsApp (ex: 224620000000)" required>

<input id="photo" type="url" placeholder="Lien de la photo (facultatif)">

<select id="cat" style="width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:7px">

<option>Téléphones</option>

<option>Vêtements</option>

<option>Chaussures</option>

<option>Accessoires</option>

<option>Autres</option>

</select>

<textarea id="description" placeholder="Description du produit"></textarea>

<button class="publish">Publier mon produit</button>

</form>

<footer>

🇬🇳 Guinée Market — Le marché de tous les Guinéens

</footer>

<script>

let items = [

{name:"Téléphone Android",price:1500000,cat:"Téléphones",photo:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500",phone:"224620000000"},

{name:"Chaussures modernes",price:250000,cat:"Chaussures",photo:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500",phone:"224620000000"},

{name:"Écouteurs",price:100000,cat:"Accessoires",photo:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500",phone:"224620000000"},

{name:"T-shirt",price:120000,cat:"Vêtements",photo:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500",phone:"224620000000"}

];

let selected="Tous";

function category(cat,btn){

selected=cat;

document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

render();

}

function render(){

let q=document.getElementById("search").value.toLowerCase();

let filtered=items.filter(p=>(selected==="Tous"||p.cat===selected)&&p.name.toLowerCase().includes(q));

document.getElementById("products").innerHTML=filtered.map(p=>`

<div class="product">

<img src="${p.photo || 'https://placehold.co/400x300?text=Produit'}" onerror="this.src='https://placehold.co/400x300?text=Produit'">

<div class="info">

<h3>${p.name}</h3>

<div class="price">${Number(p.price).toLocaleString("fr-FR")} GNF</div>

<button onclick="contact('${p.phone}','${p.name.replace(/'/g,"")}')">Contacter sur WhatsApp</button>

</div>

</div>`).join("") || "<p>Aucun produit trouvé.</p>";

}

function contact(phone,name){

if(!phone){alert("Numéro du vendeur non renseigné");return}

window.open("https://wa.me/"+phone.replace(/\D/g,"")+"?text="+encodeURIComponent("Bonjour, je suis intéressé par "+name)," _blank");

}

function addProduct(e){

e.preventDefault();

items.unshift({

name:document.getElementById("name").value,

price:Number(document.getElementById("price").value),

phone:document.getElementById("phone").value,

photo:document.getElementById("photo").value,

cat:document.getElementById("cat").value

});

e.target.reset();

selected="Tous";

document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));

document.querySelector(".categories button").classList.add("active");

render();

alert("Annonce ajoutée sur cette page !");

}

render();

</script>

</body>

</html>
