
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guinée Market</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f6f3;color:#222}
header{background:#087b43;color:white;text-align:center;padding:22px}
header h1{margin:0}
main{padding:15px;max-width:700px;margin:auto}
input,select,button{font:inherit}
input,select{width:100%;padding:13px;margin:7px 0;border:1px solid #ccc;border-radius:9px;background:white}
button{border:0;border-radius:9px;padding:12px;background:#087b43;color:white;cursor:pointer}
h2{margin-top:25px}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:white;border-radius:12px;padding:10px;overflow:hidden}
.product img{width:100%;height:130px;object-fit:cover;border-radius:8px}
.product h3{font-size:16px;margin:8px 0}
.price{color:#087b43;font-weight:bold}
.form{background:white;padding:15px;border-radius:12px}
#message{color:#087b43;font-weight:bold}
</style>
</head>
<body>
<header>
<h1>🇬🇳 Guinée Market</h1>
<p>Achetez et vendez facilement en Guinée</p>
</header>

<main>
<input id="search" type="search" placeholder="Rechercher un produit...">

<h2>Publier un produit</h2>
<form class="form" id="productForm">
<input id="name" placeholder="Nom du produit" required>
<input id="price" type="number" min="1" placeholder="Prix en GNF" required>
<select id="category" required>
<option value="">Choisir une catégorie</option>
<option>Téléphones</option>
<option>Vêtements</option>
<option>Maison</option>
<option>Véhicules</option>
<option>Autres</option>
</select>
<label>Photo du produit</label>
<input id="photo" type="file" accept="image/*" required>
<button type="submit">Publier mon produit</button>
<p id="message"></p>
</form>

<h2>Produits disponibles</h2>
<div class="products" id="products"></div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://qbxpampyrwqsiqvuehsb.supabase.co";
const SUPABASE_KEY = sb_publishable_jGnJAvt2TPpuSedHMkzScg_g4x1YhZo";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("productForm");
const list = document.getElementById("products");
const message = document.getElementById("message");
const search = document.getElementById("search");

let products = [];

function displayProducts() {
  const term = search.value.toLowerCase();
  list.innerHTML = "";

  const filtered = products.filter(p =>
    (p.name + " " + p.category).toLowerCase().includes(term)
  );

  if (filtered.length === 0) {
    list.innerHTML = "<p>Aucun produit pour le moment.</p>";
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement("div");
    card.className = "product";

    const img = document.createElement("img");
    img.src = p.photo;
    img.alt = p.name;

    const title = document.createElement("h3");
    title.textContent = p.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent =
      Number(p.price).toLocaleString("fr-FR") + " GNF";

    const category = document.createElement("p");
    category.textContent = p.category;

    card.append(img, title, price, category);
    list.appendChild(card);
  });
}

async function loadProducts() {
  const { data, error } = await supabaseClient
    .from("Products")
    .select("id, name, price, category, photo")
    .order("id", { ascending: false });

  if (error) {
    message.textContent = "Erreur : " + error.message;
    return;
  }

  products = data || [];
  displayProducts();
}

function compressPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = function() {
      const img = new Image();

      img.onload = function() {
        const canvas = document.createElement("canvas");
        const max = 800;
        let width = img.width;
        let height = img.height;

        if (width > height && width > max) {
          height = Math.round(height * max / width);
          width = max;
        } else if (height > max) {
          width = Math.round(width * max / height);
          height = max;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        resolve(canvas.toDataURL("image/jpeg", 0.55));
      };

      img.onerror = () => reject(new Error("Photo illisible."));
      img.src = reader.result;
    };

    reader.onerror = () => reject(new Error("Lecture impossible."));
    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const price = Number(document.getElementById("price").value);
  const category = document.getElementById("category").value;
  const file = document.getElementById("photo").files[0];

  if (!name || price <= 0 || !category || !file) {
    message.textContent = "Remplis tous les champs.";
    return;
  }

  if (file.size > 5000000) {
    message.textContent = "Photo trop volumineuse (maximum 5 Mo).";
    return;
  }

  message.textContent = "Publication en cours...";

  try {
    const photo = await compressPhoto(file);

    const { error } = await supabaseClient
      .from("Products")
      .insert([{
        name: name,
        price: price,
        category: category,
        photo: photo
      }]);

    if (error) throw error;

    form.reset();
    message.textContent = "Produit publié avec succès !";
    await loadProducts();

  } catch (error) {
    message.textContent = "Erreur : " + error.message;
  }
});

search.addEventListener("input", displayProducts);

loadProducts();
</script>

</body>
</html>
